      description: Liveness probe.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - version
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                  version:
                    type: string
      security: []
      x-thelife-tool:
        effect: read
        scopes: []
        exposure:
        - rest
        principals:
        - user
        stage: 1
  /readyz:
    get:
      operationId: system.readyz
      tags:
      - System
      summary: Readiness probe (database reachable and at the expected schema version)
      description: Readiness probe (database reachable and at the expected schema version).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - checks
                - schema_version
                properties:
                  status:
                    type: string
                    enum:
                    - ready
                    - not_ready
                  checks:
                    type: object
                    properties:
                      database:
                        type: string
                  schema_version:
                    type: string
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security: []
      x-thelife-tool:
        effect: read
        scopes: []
        exposure:
        - rest
        principals:
        - user
