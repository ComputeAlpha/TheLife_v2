info:
  title: TheLife API
  version: 0.1.0-draft
  description: "Public API of TheLife v2. Every client (collector, demo UI, React frontend, external apps, MCP) uses this\n\
    contract. Conventions:\n- JSON bodies; timestamps are RFC 3339 with offset; ids are UUIDv7.\n- Errors are RFC 9457 `application/problem+json`.\n\
    - Lists use opaque cursors: `?limit=&cursor=` → `{items, next_cursor}`; `?updated_since=` supports sync.\n- Updates are\
    \ JSON Merge Patch (RFC 7396) and require `If-Match: \"<version>\"`; deletes are soft and also\n  require `If-Match`.\n\
    - POSTs accept `Idempotency-Key`; collector ingest requires it.\n- Resources of another tenant answer 404, never 403.\n"
  license:
    name: AGPL-3.0-or-later
servers:
- url: /
security:
- bearer: []
tags:
- name: API keys
  description: Scoped keys for external apps and MCP clients. Writes made with a key become proposals for MCP clients.
- name: Activities
  description: Things the user did, logged manually, through chat, by the agent, or confirmed from detections.
- name: Auth
  description: Login, session and the current user's profile. Accounts are created by an admin only (no signup).
- name: Calendar
  description: Calendar events and planned time blocks. category routine.<kind> fixes a routine occurrence; day_profile.<name>
    on an all-day event overrides the day profile (agent_lld.md §4.4, scoring_lld.md §3).
- name: Detections
  description: Append-only observations of what the user did (backend_lld.md §6.5). Content never changes; status moves through
    events. confirm, dispute and claim append records, so they are create effects, not updates.
- name: Devices
  description: Collector devices. Registering one returns its device token once (backend_lld.md §6.1, collector_lld.md §8).
- name: Entertainment
  description: Games, movies and series the user wants to enjoy. Tracked and scheduled; never limited (scoring_lld.md §6).
- name: Entertainment
  description: Pre-scheduled entertainment time.
- name: Goals
  description: Long-term goals, nestable by horizon (year → quarter → month → week).
- name: Ingest
  description: Collector uploads (backend_lld.md §7.2, collector_lld.md §7). Device tokens only; Idempotency-Key required.
- name: Plans
  description: Plans for a period, optionally serving a goal.
- name: Skills
  description: Books (with page counts) and video courses (with sections and total duration).
- name: Skills
  description: Ordered sections of a course.
- name: Skills
  description: A study session on a book (page range) or course (section and timeline positions).
- name: System
  description: Liveness and readiness probes (not under /api/v1).
- name: Tasks
  description: Ad hoc and recurring tasks. A task with an rrule is recurring; its occurrences are expanded on read and materialized
    only when acted on (backend_lld.md §6.3).
- name: Work
  description: Dated deliverables of a project; milestones due on a day count in plan adherence.
- name: Work
  description: Projects under a role; tasks and deliverables link to them.
- name: Work
  description: Ongoing responsibilities under a role.
- name: Work
  description: Roles the user holds (job, side project, volunteer). Work contexts for scoring live in Stage 2.
