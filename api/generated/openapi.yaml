    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: The ETag of the copy the client holds; 304 when it is still current.
      schema:
        type: string
        maxLength: 64
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The resource version from its ETag, for example "3".
      schema:
        type: string
        pattern: ^"[1-9][0-9]{0,8}"$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-chosen key of 8 to 128 visible ASCII characters; the stored response is replayed for 24 h. Required
        on /ingest/*.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[!-~]{8,128}$
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: Required for collector ingest; retries with the same key replay the stored response.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[!-~]{8,128}$
  headers:
    ETag:
      description: Quoted resource version.
      schema:
        type: string
    ContentETag:
      description: Quoted hash of the response body; send it back as If-None-Match.
      schema:
        type: string
  responses:
    NotModified:
      description: The copy named by If-None-Match is current; no body.
    Accepted:
      description: Held for approval or recorded as a proposal; nothing changed yet.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PendingDecision'
    Unauthorized:
      description: Missing, expired or revoked token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but lacking the scope or principal kind for this operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Does not exist, is deleted, or belongs to another tenant.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: The body is not a JSON object.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: The request Content-Type is not the documented one.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: Request failed schema validation; see errors[].
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match does not match the current version.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: If-Match header missing.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with the current state (for example an invalid status transition).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limited; honour Retry-After.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Temporarily unable to accept the request; honour Retry-After.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
