# Shared contract definitions. Schema references use the short form {$ref: Name}; the generator rewrites them
# to OpenAPI component refs, and inlines them for the tool manifest and agent tool definitions.
# Conventions: backend_lld.md §7. Format of this file: docs/tool_registry.md.

info:
  title: TheLife API
  version: 0.1.0-draft
  description: |
    Public API of TheLife v2. Every client (collector, demo UI, React frontend, external apps, MCP) uses this
    contract. Conventions:
    - JSON bodies; timestamps are RFC 3339 with offset; ids are UUIDv7.
    - Errors are RFC 9457 `application/problem+json`.
    - Lists use opaque cursors: `?limit=&cursor=` → `{items, next_cursor}`; `?updated_since=` supports sync.
    - Updates are JSON Merge Patch (RFC 7396) and require `If-Match: "<version>"`; deletes are soft and also
      require `If-Match`.
    - POSTs accept `Idempotency-Key`; collector ingest requires it.
    - Resources of another tenant answer 404, never 403.
  license:
    name: AGPL-3.0-or-later

schemas:
  Id:
    type: string
    format: uuid
    description: UUIDv7.
  Timestamp:
    type: string
    format: date-time
  LocalDate:
    type: string
    format: date
    description: A calendar day in the user's timezone, honouring day_start_hour.
  TimeOfDay:
    type: string
    pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
  Area:
    type: string
    enum: [work, skill, fitness, personal, entertainment, other]
  Priority:
    type: integer
    minimum: 0
    maximum: 3
    description: 0 low, 1 normal, 2 high, 3 critical.
  PrincipalKind:
    type: string
    enum: [user, agent, external, device, system]
  Origin:
    type: string
    enum: [direct, user_stated, inferred, imported]
    description: How the item came to exist (agent_lld.md §7.4). user_stated items count as user-entered for edits.
  RRule:
    type: string
    maxLength: 500
    pattern: "^(RRULE:)?FREQ=(DAILY|WEEKLY|MONTHLY|YEARLY)(;[A-Z]+=[^;]+)*$"
    description: RFC 5545 recurrence rule, for example FREQ=WEEKLY;BYDAY=MO,WE,FR.
  Text200:
    type: string
    minLength: 1
    maxLength: 200
  Notes:
    type: [string, "null"]
    maxLength: 10000
  Scope:
    type: string
    pattern: "^[a-z_]+:(read|write)$"
  ResourceMeta:
    type: object
    required: [id, created_at, updated_at, version, created_by, origin]
    properties:
      id: {$ref: Id}
      created_at: {$ref: Timestamp}
      updated_at: {$ref: Timestamp}
      version:
        type: integer
        minimum: 1
        description: Optimistic-concurrency version; also returned as the ETag.
      created_by:
        type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind: {$ref: PrincipalKind}
          id: {type: [string, "null"], format: uuid}
      origin: {$ref: Origin}
      source_message_id: {type: [string, "null"], format: uuid}
      deleted_at: {type: [string, "null"], format: date-time}
  Problem:
    type: object
    description: RFC 9457 problem details.
    required: [type, title, status]
    properties:
      type: {type: string, format: uri}
      title: {type: string}
      status: {type: integer}
      detail: {type: string}
      instance: {type: string}
      request_id: {type: string}
      errors:
        type: array
        items:
          type: object
          required: [path, message]
          properties:
            path: {type: string, description: JSON Pointer into the request body or a parameter name.}
            message: {type: string}
  PendingDecision:
    type: object
    description: Returned with 202 when a write was held for approval (agent) or turned into a proposal (MCP).
    required: [status]
    properties:
      status: {type: string, enum: [pending_approval, proposed]}
      approval_id: {$ref: Id}
      proposal_id: {$ref: Id}

parameters:
  IfMatch:
    name: If-Match
    in: header
    required: true
    description: The resource version from its ETag, for example "3".
    schema: {type: string, pattern: '^"[0-9]+"$'}
  IdempotencyKey:
    name: Idempotency-Key
    in: header
    required: false
    description: Client-chosen key; the stored response is replayed for 24 h. Required on /ingest/*.
    schema: {type: string, minLength: 8, maxLength: 128}
  IdempotencyKeyRequired:
    name: Idempotency-Key
    in: header
    required: true
    description: Required for collector ingest; retries with the same key replay the stored response.
    schema: {type: string, minLength: 8, maxLength: 128}

headers:
  ETag:
    description: Quoted resource version.
    schema: {type: string}

responses:
  Accepted:
    description: Held for approval or recorded as a proposal; nothing changed yet.
    content:
      application/json:
        schema: {$ref: PendingDecision}
  Unauthorized:
    description: Missing, expired or revoked token.
    content:
      application/problem+json:
        schema: {$ref: Problem}
  Forbidden:
    description: Authenticated but lacking the scope or principal kind for this operation.
    content:
      application/problem+json:
        schema: {$ref: Problem}
  NotFound:
    description: Does not exist, is deleted, or belongs to another tenant.
    content:
      application/problem+json:
        schema: {$ref: Problem}
  ValidationFailed:
    description: Request failed schema validation; see errors[].
    content:
      application/problem+json:
        schema: {$ref: Problem}
  PreconditionFailed:
    description: If-Match does not match the current version.
    content:
      application/problem+json:
        schema: {$ref: Problem}
  PreconditionRequired:
    description: If-Match header missing.
    content:
      application/problem+json:
        schema: {$ref: Problem}
  Conflict:
    description: The request conflicts with the current state (for example an invalid status transition).
    content:
      application/problem+json:
        schema: {$ref: Problem}
  TooManyRequests:
    description: Rate limited; honour Retry-After.
    headers:
      Retry-After:
        schema: {type: integer}
    content:
      application/problem+json:
        schema: {$ref: Problem}
  ServiceUnavailable:
    description: Temporarily unable to accept the request; honour Retry-After.
    headers:
      Retry-After:
        schema: {type: integer}
    content:
      application/problem+json:
        schema: {$ref: Problem}
