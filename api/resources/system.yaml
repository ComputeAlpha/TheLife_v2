name: system
tag: System
description: Liveness and readiness probes (not under /api/v1).
exposure: [rest]
principals: [user]
actions:
  - name: healthz
    tool: false
    public: true
    absolute: true
    method: get
    path: /healthz
    effect: read
    summary: Liveness probe
    returns:
      type: object
      required: [status, version]
      properties:
        status: {type: string, enum: [ok]}
        version: {type: string}
  - name: readyz
    tool: false
    public: true
    absolute: true
    method: get
    path: /readyz
    effect: read
    summary: Readiness probe (database reachable and at the expected schema version)
    extra_responses: {503: ServiceUnavailable}
    returns:
      type: object
      required: [status, checks, schema_version]
      properties:
        status: {type: string, enum: [ready, not_ready]}
        checks:
          type: object
          properties:
            database: {type: string}
        schema_version: {type: string}
  - name: llm_status
    tool: false
    stage: 2
    method: get
    path: /system/llm-status
    effect: read
    summary: Assistant availability (LLM gateway mode and provider states) and this week's usage
    returns:
      type: object
      required: [mode, resets_at, providers, usage]
      properties:
        mode:
          type: string
          enum: [online, manual, unconfigured]
          description: "manual means no model is usable (quota exhausted or providers disabled); chat answers deterministic commands only."
        resets_at: {type: [string, "null"], format: date-time, description: "When manual mode is expected to end, if known."}
        providers:
          type: array
          items:
            type: object
            required: [name, role, kind, model, state, until, quota_scope]
            properties:
              name: {type: string}
              role: {type: string, enum: [primary, fallback]}
              kind: {type: string, enum: [openai, stub]}
              model: {type: [string, "null"]}
              state: {type: string, enum: [healthy, throttled, exhausted, probing, disabled]}
              until: {type: [string, "null"], format: date-time}
              quota_scope: {type: [string, "null"]}
        usage:
          type: object
          required: [weekly_request_estimate]
          properties:
            week_start: {$ref: LocalDate}
            requests: {type: integer}
            failures: {type: integer}
            tokens_in: {type: integer}
            tokens_out: {type: integer}
            images: {type: integer}
            weekly_request_estimate: {type: integer, description: "Soft estimate; exceeding it only triggers a warning."}
