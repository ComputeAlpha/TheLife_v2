name: work_responsibilities
agent_group: work
schema: WorkResponsibility
noun: responsibility
plural_noun: responsibilities
path: /work/responsibilities
scope: work
tag: Work
description: Ongoing responsibilities under a role.
fields:
  role_id: {$ref: Id}
  title: {$ref: Text200}
  description: {$ref: Notes}
  cadence: {type: [string, "null"], maxLength: 500, pattern: '^(RRULE:)?FREQ=(DAILY|WEEKLY|MONTHLY|YEARLY)(;[A-Z]+=[A-Z0-9,+-]+)*$', description: "Optional RRULE for recurring duties."}
  active: {type: boolean, default: true}
required: [role_id, title]
filters:
  role_id: {$ref: Id}
  active: {type: boolean}
ops: {list: {}, get: {}, create: {}, update: {}, delete: {}}
