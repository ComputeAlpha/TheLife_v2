name: auth
tag: Auth
description: Login, session and the current user's profile. Accounts are created by an admin only (no signup).
exposure: [rest]
principals: [user]
extra_schemas:
  User:
    type: object
    additionalProperties: false
    required: [id, email, display_name, timezone, day_start_hour, role]
    properties:
      id: {$ref: Id}
      email: {type: string, format: email}
      display_name: {$ref: Text200}
      timezone: {type: string, minLength: 1, maxLength: 64, description: "IANA timezone, for example Asia/Kolkata."}
      day_start_hour: {type: integer, minimum: 0, maximum: 12}
      role: {type: string, enum: [user, tenant_admin]}
      workdays:
        type: array
        uniqueItems: true
        maxItems: 7
        items: {type: string, enum: [MO, TU, WE, TH, FR, SA, SU]}
  Session:
    type: object
    required: [token, expires_at, user]
    properties:
      token: {type: string, description: "tlu_ session token; shown once."}
      expires_at: {$ref: Timestamp}
      user: {$ref: User}
  WebSession:
    type: object
    required: [expires_at, user]
    properties:
      expires_at: {$ref: Timestamp}
      user: {$ref: User}
actions:
  - name: login
    tool: false
    public: true
    method: post
    path: /auth/login
    effect: create
    summary: Exchange email and password for a session token
    extra_responses: {401: Unauthorized, 429: TooManyRequests}
    body:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 320}
        password: {type: string, minLength: 1, maxLength: 1024}
    returns: Session
  - name: logout
    tool: false
    method: post
    path: /auth/logout
    effect: delete
    summary: Revoke the current session token
    status: 204
  - name: web_session_create
    tool: false
    public: true
    method: post
    path: /auth/web-session
    effect: create
    summary: Sign in from the web UI; the session token is set as an HttpOnly cookie
    description: >-
      Same credentials and rate limits as auth.login. The token is never in the body: it is set as the cookie
      tl_session (HttpOnly, Secure, SameSite=Strict, Path=/api). Requests authenticated by that cookie must send
      X-TheLife-CSRF: 1 on POST, PATCH, PUT and DELETE (frontend_lld.md §2.2).
    extra_responses: {401: Unauthorized, 429: TooManyRequests}
    body:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 320}
        password: {type: string, minLength: 1, maxLength: 1024}
    returns: WebSession
  - name: web_session_delete
    tool: false
    method: delete
    path: /auth/web-session
    effect: delete
    summary: Sign out of the web UI; revokes the session and clears the cookie
    status: 204
  - name: me
    tool: false
    method: get
    path: /me
    effect: read
    summary: Current user
    returns: User
  - name: update_me
    tool: false
    method: patch
    path: /me
    effect: update
    summary: Update profile settings (timezone, day start hour, workdays, display name)
    content_type: application/merge-patch+json
    body:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name: {$ref: Text200}
        timezone: {type: string, minLength: 1, maxLength: 64, description: "IANA timezone, for example Asia/Kolkata."}
        day_start_hour: {type: integer, minimum: 0, maximum: 12}
        workdays:
          type: array
          uniqueItems: true
          maxItems: 7
          items: {type: string, enum: [MO, TU, WE, TH, FR, SA, SU]}
    returns: User
  - name: change_password
    tool: false
    method: post
    path: /me/password
    effect: update
    summary: Change password; revokes all other sessions
    status: 204
    body:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: {type: string, minLength: 1, maxLength: 1024}
        new_password: {type: string, minLength: 12, maxLength: 1024}
