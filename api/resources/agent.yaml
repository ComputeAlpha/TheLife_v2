name: agent
tag: Agent
description: Agent-only tools (agent_lld.md §5.1). Not reachable over REST.
stage: 2
exposure: [agent]
principals: [agent]
agent_group: core
actions:
  - name: context.now
    effect: read
    summary: "Current local time and day, today's plan with completion state, pending approvals, and whether agent writes are enabled"
    body: {type: object, additionalProperties: false, properties: {}}
    returns:
      type: object
      required: [now, local_day, timezone, today, pending_approvals, agent_writes_enabled]
      properties:
        now: {type: string, description: Local time with offset.}
        local_day: {$ref: LocalDate}
        timezone: {type: string}
        day_start_hour: {type: integer}
        today: {type: array, items: {$ref: CalendarEntry}}
        pending_approvals: {type: integer}
        agent_writes_enabled: {type: boolean}
  - name: agent.load_tools
    effect: read
    summary: "Load a group of tools for the rest of this turn: planning (goals, plans, tasks, events, activities), work, skills, entertainment, detections"
    body:
      type: object
      additionalProperties: false
      required: [group]
      properties:
        group: {type: string, enum: [planning, work, skills, entertainment, detections]}
    returns:
      type: object
      required: [loaded]
      properties:
        loaded: {type: array, items: {type: string}}
  - name: memory.remember
    effect: create
    summary: "Remember a short fact about the user for later conversations (a preference, a person, a habit, a plan). Use the user's words; one fact per call"
    body:
      type: object
      additionalProperties: false
      required: [subject, statement]
      properties:
        subject: {type: string, minLength: 1, maxLength: 120, description: "Who or what the fact is about, for example \"me\", \"Priya\", \"Rust course\"."}
        subject_kind: {type: string, enum: [self, person, project, goal, habit, preference, place, app, topic, other], default: self}
        statement: {type: string, minLength: 1, maxLength: 280, description: "The fact as one sentence."}
        predicate: {type: string, maxLength: 80}
        value: {type: string, maxLength: 280}
        pinned: {type: boolean, default: false, description: Always keep this in mind (core profile).}
    returns: MemoryFact
  - name: memory.recall
    effect: read
    summary: Look up remembered facts about a person, project or topic
    body:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: {type: string, minLength: 1, maxLength: 200}
        limit: {type: integer, minimum: 1, maximum: 20, default: 8}
    returns:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, subject, statement, confidence, origin]
            properties:
              id: {$ref: Id}
              subject: {type: string}
              statement: {type: string}
              confidence: {type: number}
              origin: {$ref: Origin}
              created_at: {$ref: Timestamp}
  - name: memory.update_fact
    effect: update
    summary: "Replace a remembered fact with a corrected one (the old fact is kept as superseded). Facts the user stated need their approval"
    target: true
    target_resource: MemoryFact
    body:
      type: object
      additionalProperties: false
      required: [id, statement]
      properties:
        id: {$ref: Id}
        statement: {type: string, minLength: 1, maxLength: 280}
        confidence: {type: number, minimum: 0, maximum: 1}
    returns: MemoryFact
  - name: memory.forget
    effect: delete
    summary: "Forget a remembered fact. Facts the user stated need their approval"
    target: true
    target_resource: MemoryFact
    policy: user_stated_fact
    body:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {$ref: Id}
    returns: {type: "null"}
  - name: history.search
    effect: read
    summary: "Search past conversations, activities and day summaries by keywords (last 3 months unless from/to say otherwise)"
    body:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: {type: string, minLength: 1, maxLength: 200}
        from: {$ref: Timestamp}
        to: {$ref: Timestamp}
        limit: {type: integer, minimum: 1, maximum: 30, default: 10}
    returns:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [kind, id, at, text]
            properties:
              kind: {type: string, enum: [message, activity, day_summary]}
              id: {$ref: Id}
              at: {$ref: Timestamp}
              channel: {type: [string, "null"]}
              text: {type: string}
