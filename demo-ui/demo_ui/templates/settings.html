{% extends "base.html" %}
{% from "_fields.html" import field %}
{% block title %}Settings{% endblock %}
{% block body %}
<h1>Settings</h1>
<div class="cols">
<section class="card">
  <h2>Profile</h2>
  <p class="muted">{{ me.email }} · {{ me.role }}</p>
  <form method="post" class="grid">
    <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="form" value="profile">
    {% for f in fields %}{{ field(f) }}{% endfor %}
    <div class="actions"><button>Save</button></div>
  </form>
</section>
<section class="card">
  <h2>Password</h2>
  <form method="post" class="grid">
    <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="form" value="password">
    <label class="field"><span class="name">current password</span><input type="password" name="current_password" autocomplete="current-password" required></label>
    <label class="field"><span class="name">new password</span><input type="password" name="new_password" autocomplete="new-password" minlength="12" required></label>
    <div class="actions"><button>Change password</button> <span class="muted">signs out your other sessions</span></div>
  </form>
</section>
</div>
{% endblock %}
